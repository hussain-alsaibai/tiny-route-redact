[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-route-redact"
version = "0.2.0"
description = "Middleware that redacts credentials from route paths."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "OpenClaw", email = "hussain.alsaibai@gmail.com"}]
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "tiny-secret-mask>=0.4.0",
]

[tool.setuptools]
py-modules = ["tiny_route_redact"]
